name: Commit CI

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    tags:
      - '![0-9]+.*'
    paths:
      - '**/**'
      - '!*.md'
      - '!.gitignore'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4

      - name: Install clang-format 18
        run: |
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor < llvm-snapshot.gpg.key > /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          clang-format --version

      - name: Code style lint
        shell: bash
        run: ./clang-format.sh -i

  build:
    needs: lint
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:

      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        run: |
          git remote add rime https://github.com/rime/weasel.git
          git fetch rime --tags -f

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2022.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: 10.0.19041.0

      - name: Get Rime files
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev
          # get-rime.ps1 exits quietly on errors (e.g. API rate limits): fail here instead of at link time
          foreach ($f in 'lib/rime.lib', 'lib64/rime.lib', 'output/rime.dll') {
            if (-not (Test-Path $f)) { throw "get-rime.ps1 did not provide $f" }
          }

      - name: Get WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-webview2.ps1

      - name: Get llama.cpp headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-llama-headers.ps1

      - name: Get llama.cpp runtime (CPU)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-llama-runtime.ps1 -Flavor cpu

      - name: Build data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: Build Weasel
        shell: pwsh
        id: build_weasel
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SDKVER="10.0.19041.0"
          .\build.bat arm64 installer

      # 單元測試（x64）：用剛建好的 output\ 與 output\llama（CPU 版）；注音方案資料來自 Build data
      - name: Unit tests
        shell: pwsh
        env:
          RIME_SHARED: ${{ github.workspace }}\output\data
          WEASEL_INSTALL: ${{ github.workspace }}\output\llama
        run: |
          $failed = @()
          foreach ($t in 'TestCoreBase', 'TestIme', 'TestPersonalCrypto', 'TestLLMHost', 'TestLLMHttp', 'TestController') {
            Write-Host "==== $t"
            cmd /c "test\$t\run.bat"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed) { throw "Unit tests failed: $($failed -join ', ')" }

      # 第二個安裝程式：llama.cpp 換成 CUDA 版（NVIDIA GPU 加速），版本號沿用第一個安裝程式的檔名
      - name: Build CUDA installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-llama-runtime.ps1 -Flavor cuda
          $installer = Get-ChildItem output\archives -Filter 'weasel-*-installer.exe' | Select-Object -First 1
          $product = $installer.Name -replace '^weasel-(.*)-installer\.exe$', '$1'
          $parts = $product.Split('.')
          & "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe" "/DWEASEL_VERSION=$($parts[0..2] -join '.')" `
            "/DWEASEL_BUILD=$($parts[3])" "/DPRODUCT_VERSION=$product" /DLLAMA_FLAVOR=cuda output\install.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          Get-ChildItem output\archives -Filter 'weasel-*.exe' | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB)) MB" }

      - name: Compress Debug Symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          output\7z.exe a -t7z "./output/archives/debug_symbols.7z" "output/*.pdb" -r

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weasel-artifact-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
            .\output\archives\debug_symbols.7z

      - name: Create Personal Build
        if: ${{ github.repository == 'fxliang/weasel' && github.ref == 'refs/heads/pb' }}
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: pblatest
          prerelease: true
          title: "Personal Build"
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z

  xbuild:
    needs: lint
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:

      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        run: |
          git remote add rime https://github.com/rime/weasel.git
          git fetch rime --tags -f

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2022.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      # xmake 2.9.4 or later
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.4'
          actions-cache-folder: '.xmake-cache'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: 10.0.19041.0

      - name: Get Rime files
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev
          # get-rime.ps1 exits quietly on errors (e.g. API rate limits): fail here instead of at link time
          foreach ($f in 'lib/rime.lib', 'lib64/rime.lib', 'output/rime.dll') {
            if (-not (Test-Path $f)) { throw "get-rime.ps1 did not provide $f" }
          }

      - name: Get WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-webview2.ps1

      - name: Get llama.cpp headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-llama-headers.ps1

      - name: Get llama.cpp runtime (CPU)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-llama-runtime.ps1 -Flavor cpu


      - name: Build data
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: Build Weasel
        id: build_weasel
        shell: cmd
        run: |
          set SDKVER=10.0.19041.0
          .\xbuild.bat arm64 installer


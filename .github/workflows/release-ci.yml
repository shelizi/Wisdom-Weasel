name: Release CI

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        if: github.ref == 'refs/heads/master'
        run: git fetch --tags

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2022.bat env.bat

      # cache boost
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      # install boost if not cached
      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: 10.0.19041.0

      # use upper stream released librime files if stable release
      - name: Get Rime files
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev
          # get-rime.ps1 exits quietly on errors (e.g. API rate limits): fail here instead of at link time
          foreach ($f in 'lib/rime.lib', 'lib64/rime.lib', 'output/rime.dll') {
            if (-not (Test-Path $f)) { throw "get-rime.ps1 did not provide $f" }
          }

      - name: Get WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-webview2.ps1

      - name: Get llama.cpp headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-llama-headers.ps1

      - name: Get llama.cpp runtime (CPU)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-llama-runtime.ps1 -Flavor cpu

      - name: Build data
        run: |
          .\build.bat data

      - name: Build Weasel Release
        id: build_weasel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_BUILD: 1
        shell: cmd
        run: |
          set SDKVER=10.0.19041.0
          .\build.bat arm64 installer

      # 手動執行（workflow_dispatch）也建出安裝程式並上傳成 Artifacts，不打標籤就能試跑
      - name: Build Weasel Nightly
        id: build_weasel_nightly
        if: github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
        shell: cmd
        run: |
          set SDKVER=10.0.19041.0
          .\build.bat arm64 installer

      # 第二個安裝程式：llama.cpp 換成 CUDA 版（NVIDIA GPU 加速），版本號沿用第一個安裝程式的檔名
      - name: Build CUDA installer
        if: steps.build_weasel.outcome == 'success' || steps.build_weasel_nightly.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-llama-runtime.ps1 -Flavor cuda
          $installer = Get-ChildItem output\archives -Filter 'weasel-*-installer.exe' | Select-Object -First 1
          $product = $installer.Name -replace '^weasel-(.*)-installer\.exe$', '$1'
          $parts = $product.Split('.')
          & "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe" "/DWEASEL_VERSION=$($parts[0..2] -join '.')" `
            "/DWEASEL_BUILD=$($parts[3])" "/DPRODUCT_VERSION=$product" /DLLAMA_FLAVOR=cuda output\install.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          Get-ChildItem output\archives -Filter 'weasel-*.exe' | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB)) MB" }

      - name: Compress Debug Symbols
        shell: pwsh
        run: |
          output\7z.exe a -t7z "./output/archives/debug_symbols.7z" "output/*.pdb" -r

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weasel-release-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
            .\output\archives\debug_symbols.7z

      - name: Extract changelog
        shell: pwsh
        run: |
          .\extract_changelog.ps1
        if: startsWith(github.ref, 'refs/tags/')

      # create nightly release
      - name: Create Nightly release
        if: ${{ github.repository == 'rime/weasel' && github.ref == 'refs/heads/master' }}
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z
        
      # create stable release (a draft: publish it by hand on GitHub)
      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          draft: true
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z
          body_path: ${{ github.workspace }}/RELEASE_CHANGELOG.md
